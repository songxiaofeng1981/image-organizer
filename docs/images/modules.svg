<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-label="Image Organizer modules">
<title>Image Organizer modules</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1d1d1f; }
  .bg { fill: #ffffff; }
  .box { fill: #f3f3f5; stroke: #d2d2d7; stroke-width: 1; }
  .frame { fill: none; stroke: #007aff; stroke-width: 1.5; stroke-dasharray: 6 4; }
  .accent { fill: #e8f1ff; stroke: #007aff; stroke-width: 1.2; }
  .helper { fill: #fff4e5; stroke: #ff9500; stroke-width: 1.2; }
  .disk { fill: #eaf8ee; stroke: #34c759; stroke-width: 1.2; }
  .page { fill: #ffffff; stroke: #86868b; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .pill { fill: #ffffff; stroke: #ffcc80; stroke-width: 1; }
  .title { font-size: 15px; font-weight: 700; }
  .h { font-size: 13.5px; font-weight: 650; }
  .t { font-size: 12px; fill: #424245; }
  .s { font-size: 11px; fill: #6e6e73; }
  .label { font-size: 11.5px; fill: #0060df; font-weight: 600; }
  .frame-label { font-size: 12px; fill: #0060df; font-weight: 700; }
  .line { stroke: #007aff; stroke-width: 1.6; fill: none; }
  .line.gray { stroke: #86868b; }
  .arrow { fill: #007aff; }
  .arrow.gray { fill: #86868b; }
  @media (prefers-color-scheme: dark) {
    text { fill: #f5f5f7; }
    .bg { fill: #1e1e1e; }
    .box { fill: #2c2c2e; stroke: #48484a; }
    .accent { fill: #0b2a4d; stroke: #0a84ff; }
    .helper { fill: #3a2a12; stroke: #ff9f0a; }
    .disk { fill: #123320; stroke: #30d158; }
    .page { fill: #1e1e1e; stroke: #8e8e93; }
    .pill { fill: #2c2c2e; stroke: #8a5a1c; }
    .frame { stroke: #0a84ff; }
    .t { fill: #d1d1d6; }
    .s { fill: #a1a1a6; }
    .label, .frame-label { fill: #64a8ff; }
    .line { stroke: #0a84ff; }
    .line.gray { stroke: #8e8e93; }
    .arrow { fill: #0a84ff; }
    .arrow.gray { fill: #8e8e93; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
  </marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="arrow gray" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" width="960" height="760" rx="14"/>
<text class="title" x="30" y="36" text-anchor="start">Image Organizer modules</text>
<text class="frame-label" x="30" y="70" text-anchor="start">Pages (entry points)</text>
<rect class="accent" x="30" y="82" width="340" height="112" rx="10"/>
<text class="h" x="44" y="104" text-anchor="start">main.js</text>
<text class="t" x="44" y="123" text-anchor="start">gallery wiring: sidebar, toolbar,</text>
<text class="t" x="44" y="140" text-anchor="start">filing, undo, library dialog, keys</text>
<text class="s" x="44" y="157" text-anchor="start">uses: library · grid · viewer · store</text>
<text class="s" x="44" y="172" text-anchor="start">images · ui · host · i18n</text>
<rect class="accent" x="390" y="82" width="330" height="112" rx="10"/>
<text class="h" x="404" y="104" text-anchor="start">popup.js</text>
<text class="t" x="404" y="123" text-anchor="start">toolbar popup: list this page's</text>
<text class="t" x="404" y="140" text-anchor="start">pictures, save the chosen ones</text>
<text class="s" x="404" y="157" text-anchor="start">uses: collect · saver · store · i18n</text>
<rect class="accent" x="740" y="82" width="190" height="112" rx="10"/>
<text class="h" x="754" y="104" text-anchor="start">background.js</text>
<text class="t" x="754" y="123" text-anchor="start">right-click menu on pictures:</text>
<text class="t" x="754" y="140" text-anchor="start">Save to Picture Library ▸</text>
<text class="s" x="754" y="157" text-anchor="start">uses: saver · store · i18n</text>
<text class="frame-label" x="30" y="236" text-anchor="start">Views and features</text>
<rect class="box" x="30" y="248" width="210" height="96" rx="10"/>
<text class="h" x="44" y="270" text-anchor="start">library.js</text>
<text class="t" x="44" y="289" text-anchor="start">views, smart categories,</text>
<text class="t" x="44" y="306" text-anchor="start">groups, sorting</text>
<text class="s" x="44" y="323" text-anchor="start">uses: store · i18n</text>
<rect class="box" x="255" y="248" width="210" height="96" rx="10"/>
<text class="h" x="269" y="270" text-anchor="start">grid.js</text>
<text class="t" x="269" y="289" text-anchor="start">justified rows, sections,</text>
<text class="t" x="269" y="306" text-anchor="start">selection, drag box</text>
<text class="s" x="269" y="323" text-anchor="start">uses: images · ui · i18n</text>
<rect class="box" x="480" y="248" width="210" height="96" rx="10"/>
<text class="h" x="494" y="270" text-anchor="start">viewer.js</text>
<text class="t" x="494" y="289" text-anchor="start">big picture view,</text>
<text class="t" x="494" y="306" text-anchor="start">info panel</text>
<text class="s" x="494" y="323" text-anchor="start">uses: images · ui · library</text>
<rect class="page" x="720" y="248" width="210" height="96" rx="10"/>
<text class="h" x="734" y="270" text-anchor="start">collect.js</text>
<text class="t" x="734" y="289" text-anchor="start">runs inside the web page:</text>
<text class="t" x="734" y="306" text-anchor="start">collectImages, fetchImage</text>
<text class="s" x="734" y="323" text-anchor="start">no imports</text>
<text class="frame-label" x="30" y="386" text-anchor="start">Shared modules</text>
<rect class="box" x="30" y="398" width="168" height="96" rx="10"/>
<text class="h" x="44" y="420" text-anchor="start">store.js</text>
<text class="t" x="44" y="439" text-anchor="start">io:v2 storage, migration,</text>
<text class="t" x="44" y="456" text-anchor="start">category ↔ folder</text>
<text class="s" x="44" y="473" text-anchor="start">uses: i18n</text>
<rect class="box" x="210" y="398" width="168" height="96" rx="10"/>
<text class="h" x="224" y="420" text-anchor="start">saver.js</text>
<text class="t" x="224" y="439" text-anchor="start">save one picture: into a</text>
<text class="t" x="224" y="456" text-anchor="start">category or Downloads</text>
<text class="s" x="224" y="473" text-anchor="start">uses: host · collect · store</text>
<rect class="box" x="390" y="398" width="168" height="96" rx="10"/>
<text class="h" x="404" y="420" text-anchor="start">images.js</text>
<text class="t" x="404" y="439" text-anchor="start">thumbnail queue</text>
<text class="t" x="404" y="456" text-anchor="start">and cache</text>
<text class="s" x="404" y="473" text-anchor="start">uses: host</text>
<rect class="box" x="570" y="398" width="168" height="96" rx="10"/>
<text class="h" x="584" y="420" text-anchor="start">ui.js</text>
<text class="t" x="584" y="439" text-anchor="start">icons, menus, toasts,</text>
<text class="t" x="584" y="456" text-anchor="start">name dialog, color dots</text>
<text class="s" x="584" y="473" text-anchor="start">uses: i18n</text>
<rect class="box" x="750" y="398" width="168" height="96" rx="10"/>
<text class="h" x="764" y="420" text-anchor="start">i18n.js</text>
<text class="t" x="764" y="439" text-anchor="start">every UI string,</text>
<text class="t" x="764" y="456" text-anchor="start">English + Chinese</text>
<text class="frame-label" x="30" y="536" text-anchor="start">Bridge to the Mac</text>
<rect class="accent" x="30" y="548" width="900" height="50" rx="10"/>
<text class="h" x="44" y="570" text-anchor="start">host.js</text>
<text class="t" x="44" y="589" text-anchor="start">Native Messaging client: requests, 512 KB chunks, errors, MIN_HELPER_VERSION check</text>
<text class="frame-label" x="30" y="640" text-anchor="start">Native helper</text>
<rect class="helper" x="30" y="652" width="900" height="92" rx="10"/>
<text class="t" x="44" y="674" text-anchor="start">helper/ImageOrganizerHelper.swift · one file · resolve() checks every path</text>
<rect class="pill" x="44" y="686" width="208" height="48" rx="8"/>
<text class="h" x="56" y="706" text-anchor="start">Browse</text>
<text class="s" x="56" y="724" text-anchor="start">hello · list · thumb · full</text>
<rect class="pill" x="266" y="686" width="208" height="48" rx="8"/>
<text class="h" x="278" y="706" text-anchor="start">Picture library</text>
<text class="s" x="278" y="724" text-anchor="start">config · setLibrary · chooseFolder</text>
<rect class="pill" x="488" y="686" width="208" height="48" rx="8"/>
<text class="h" x="500" y="706" text-anchor="start">File</text>
<text class="s" x="500" y="724" text-anchor="start">file · unfile · save · renameFolder</text>
<rect class="pill" x="710" y="686" width="208" height="48" rx="8"/>
<text class="h" x="722" y="706" text-anchor="start">Finder</text>
<text class="s" x="722" y="724" text-anchor="start">trash · reveal</text>
<path class="line" d="M200,194 L200,248" marker-end="url(#a)"/>
<path class="line" d="M310,194 L360,248" marker-end="url(#a)"/>
<path class="line" d="M350,194 L585,248" marker-end="url(#a)"/>
<path class="line" d="M600,194 L825,248" marker-end="url(#a)"/>
<path class="line gray" d="M114,344 L114,398" marker-end="url(#g)"/>
<path class="line gray" d="M430,344 L430,398" marker-end="url(#g)"/>
<path class="line" d="M474,494 L474,548" marker-end="url(#a)"/>
<path class="line" d="M294,494 L294,548" marker-end="url(#a)"/>
<path class="line" d="M480,598 L480,652" marker-end="url(#a)"/>
</svg>
