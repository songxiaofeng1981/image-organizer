<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" role="img" aria-label="图片整理 模块图">
<title>图片整理 模块图</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1d1d1f; }
  .bg { fill: #ffffff; }
  .box { fill: #f3f3f5; stroke: #d2d2d7; stroke-width: 1; }
  .frame { fill: none; stroke: #007aff; stroke-width: 1.5; stroke-dasharray: 6 4; }
  .accent { fill: #e8f1ff; stroke: #007aff; stroke-width: 1.2; }
  .helper { fill: #fff4e5; stroke: #ff9500; stroke-width: 1.2; }
  .disk { fill: #eaf8ee; stroke: #34c759; stroke-width: 1.2; }
  .page { fill: #ffffff; stroke: #86868b; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .pill { fill: #ffffff; stroke: #ffcc80; stroke-width: 1; }
  .title { font-size: 15px; font-weight: 700; }
  .h { font-size: 13.5px; font-weight: 650; }
  .t { font-size: 12px; fill: #424245; }
  .s { font-size: 11px; fill: #6e6e73; }
  .label { font-size: 11.5px; fill: #0060df; font-weight: 600; }
  .frame-label { font-size: 12px; fill: #0060df; font-weight: 700; }
  .line { stroke: #007aff; stroke-width: 1.6; fill: none; }
  .line.gray { stroke: #86868b; }
  .arrow { fill: #007aff; }
  .arrow.gray { fill: #86868b; }
  @media (prefers-color-scheme: dark) {
    text { fill: #f5f5f7; }
    .bg { fill: #1e1e1e; }
    .box { fill: #2c2c2e; stroke: #48484a; }
    .accent { fill: #0b2a4d; stroke: #0a84ff; }
    .helper { fill: #3a2a12; stroke: #ff9f0a; }
    .disk { fill: #123320; stroke: #30d158; }
    .page { fill: #1e1e1e; stroke: #8e8e93; }
    .pill { fill: #2c2c2e; stroke: #8a5a1c; }
    .frame { stroke: #0a84ff; }
    .t { fill: #d1d1d6; }
    .s { fill: #a1a1a6; }
    .label, .frame-label { fill: #64a8ff; }
    .line { stroke: #0a84ff; }
    .line.gray { stroke: #8e8e93; }
    .arrow { fill: #0a84ff; }
    .arrow.gray { fill: #8e8e93; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
  </marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="arrow gray" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" width="960" height="800" rx="14"/>
<text class="title" x="30" y="36" text-anchor="start">图片整理 模块图</text>
<rect class="frame" x="30" y="52" width="290" height="352" rx="12"/>
<text class="frame-label" x="44" y="72" text-anchor="start">管理图库</text>
<rect class="accent" x="42" y="84" width="266" height="56" rx="10"/>
<text class="h" x="56" y="106" text-anchor="start">main.js</text>
<text class="t" x="56" y="125" text-anchor="start">图库的连线：侧边栏、归类、撤销、快捷键</text>
<rect class="box" x="42" y="147" width="266" height="56" rx="10"/>
<text class="h" x="56" y="169" text-anchor="start">library.js</text>
<text class="t" x="56" y="188" text-anchor="start">视图、智能分类、组、排序</text>
<rect class="box" x="42" y="210" width="266" height="56" rx="10"/>
<text class="h" x="56" y="232" text-anchor="start">grid.js</text>
<text class="t" x="56" y="251" text-anchor="start">等高行网格、日期分段、选择</text>
<rect class="box" x="42" y="273" width="266" height="56" rx="10"/>
<text class="h" x="56" y="295" text-anchor="start">viewer.js</text>
<text class="t" x="56" y="314" text-anchor="start">看大图、信息面板</text>
<rect class="box" x="42" y="336" width="266" height="56" rx="10"/>
<text class="h" x="56" y="358" text-anchor="start">images.js</text>
<text class="t" x="56" y="377" text-anchor="start">缩略图队列和缓存</text>
<rect class="frame" x="335" y="52" width="290" height="352" rx="12"/>
<text class="frame-label" x="349" y="72" text-anchor="start">下载网页图片</text>
<rect class="accent" x="347" y="84" width="266" height="56" rx="10"/>
<text class="h" x="361" y="106" text-anchor="start">popup.js</text>
<text class="t" x="361" y="125" text-anchor="start">工具栏小窗口：挑选本页图片</text>
<rect class="accent" x="347" y="147" width="266" height="56" rx="10"/>
<text class="h" x="361" y="169" text-anchor="start">background.js</text>
<text class="t" x="361" y="188" text-anchor="start">右键菜单：保存到图片库 ▸</text>
<rect class="page" x="347" y="210" width="266" height="56" rx="10"/>
<text class="h" x="361" y="232" text-anchor="start">collect.js</text>
<text class="t" x="361" y="251" text-anchor="start">在网页里：collectImages、fetchImage</text>
<rect class="box" x="347" y="273" width="266" height="56" rx="10"/>
<text class="h" x="361" y="295" text-anchor="start">saver.js</text>
<text class="t" x="361" y="314" text-anchor="start">存进分类；没有助手时存到“下载”</text>
<rect class="frame" x="640" y="52" width="290" height="352" rx="12"/>
<text class="frame-label" x="654" y="72" text-anchor="start">下载网页视频</text>
<rect class="accent" x="652" y="84" width="266" height="56" rx="10"/>
<text class="h" x="666" y="106" text-anchor="start">video/panel.js</text>
<text class="t" x="666" y="125" text-anchor="start">小窗口里的“本页视频”</text>
<rect class="page" x="652" y="147" width="266" height="56" rx="10"/>
<text class="h" x="666" y="169" text-anchor="start">video/find.js</text>
<text class="t" x="666" y="188" text-anchor="start">在网页里（MAIN）：小红书、X 的规则</text>
<rect class="page" x="652" y="210" width="266" height="56" rx="10"/>
<text class="h" x="666" y="232" text-anchor="start">video/fetch.js</text>
<text class="t" x="666" y="251" text-anchor="start">在网页里：取一次，分块交出</text>
<rect class="box" x="652" y="273" width="266" height="56" rx="10"/>
<text class="h" x="666" y="295" text-anchor="start">video/save.js</text>
<text class="t" x="666" y="314" text-anchor="start">每块 4 MB 交给助手，最后收尾</text>
<text class="frame-label" x="30" y="432" text-anchor="start">共用模块</text>
<rect class="box" x="30" y="444" width="214" height="56" rx="10"/>
<text class="h" x="44" y="466" text-anchor="start">store.js</text>
<text class="t" x="44" y="485" text-anchor="start">io:v2 存储、分类 ↔ 文件夹</text>
<rect class="box" x="256" y="444" width="214" height="56" rx="10"/>
<text class="h" x="270" y="466" text-anchor="start">page.js</text>
<text class="t" x="270" y="485" text-anchor="start">由网页得到文件名和注释</text>
<rect class="box" x="482" y="444" width="214" height="56" rx="10"/>
<text class="h" x="496" y="466" text-anchor="start">ui.js</text>
<text class="t" x="496" y="485" text-anchor="start">图标、菜单、提示条、对话框</text>
<rect class="box" x="708" y="444" width="214" height="56" rx="10"/>
<text class="h" x="722" y="466" text-anchor="start">i18n.js</text>
<text class="t" x="722" y="485" text-anchor="start">所有界面文字，英文 + 中文</text>
<path class="line gray" d="M175,404 L175,444" marker-end="url(#g)"/>
<path class="line gray" d="M480,404 L480,444" marker-end="url(#g)"/>
<path class="line gray" d="M785,404 L785,444" marker-end="url(#g)"/>
<rect class="accent" x="30" y="524" width="900" height="50" rx="10"/>
<text class="h" x="44" y="546" text-anchor="start">host.js</text>
<text class="t" x="44" y="565" text-anchor="start">Native Messaging 桥：发请求、回复按 512 KB 分块、错误分类、版本检查</text>
<text class="frame-label" x="30" y="602" text-anchor="start">本机助手</text>
<rect class="helper" x="30" y="612" width="900" height="172" rx="12"/>
<rect class="pill" x="40" y="624" width="270" height="62" rx="8"/>
<text class="h" x="52" y="646" text-anchor="start">Manage.swift</text>
<text class="s" x="52" y="664" text-anchor="start">list · thumb · full · trash · reveal</text>
<text class="s" x="52" y="678" text-anchor="start">file · unfile · renameFolder</text>
<path class="line" d="M175,574 L175,624" marker-end="url(#a)"/>
<rect class="pill" x="345" y="624" width="270" height="62" rx="8"/>
<text class="h" x="357" y="646" text-anchor="start">PictureSave.swift</text>
<text class="s" x="357" y="664" text-anchor="start">save（一张图片，base64）</text>
<path class="line" d="M480,574 L480,624" marker-end="url(#a)"/>
<rect class="pill" x="650" y="624" width="270" height="62" rx="8"/>
<text class="h" x="662" y="646" text-anchor="start">VideoSave.swift</text>
<text class="s" x="662" y="664" text-anchor="start">videoBegin · videoChunk</text>
<text class="s" x="662" y="678" text-anchor="start">videoFinish · videoCancel</text>
<path class="line" d="M785,574 L785,624" marker-end="url(#a)"/>
<rect class="pill" x="40" y="700" width="280" height="70" rx="8"/>
<text class="h" x="52" y="722" text-anchor="start">main.swift</text>
<text class="s" x="52" y="740" text-anchor="start">把每个请求交给对应部分，</text>
<text class="s" x="52" y="756" text-anchor="start">读取消息，最多 4 个同时处理</text>
<rect class="pill" x="340" y="700" width="280" height="70" rx="8"/>
<text class="h" x="352" y="722" text-anchor="start">Core.swift</text>
<text class="s" x="352" y="740" text-anchor="start">消息收发、错误、</text>
<text class="s" x="352" y="756" text-anchor="start">resolve()：路径把关</text>
<rect class="pill" x="640" y="700" width="280" height="70" rx="8"/>
<text class="h" x="652" y="722" text-anchor="start">Library.swift</text>
<text class="s" x="652" y="740" text-anchor="start">设置、索引、标签和注释、</text>
<text class="s" x="652" y="756" text-anchor="start">校验后的移动、config · setLibrary</text>
</svg>
